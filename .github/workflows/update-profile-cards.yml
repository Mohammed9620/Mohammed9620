name: Update Profile Cards

on:
  schedule:
    # Once daily at 01:15 UTC
    - cron: "15 1 * * *"
  workflow_dispatch: {}
  push:
    paths:
      - "scripts/**"
      - "fonts/**"
      - ".github/workflows/update-profile-cards.yml"

permissions:
  contents: write

concurrency: profile-cards

jobs:
  update-cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Fetch contribution data via GitHub GraphQL API
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/fetch_contributions.py

      - name: Render animated SVG cards
        run: python scripts/render_readme_cards.py

      - name: Commit updated cards if changed
        shell: bash
        run: |
          git add data/contributions.json cards/*.svg
          if git diff --cached --quiet; then
            echo "Cards are unchanged; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --quiet --message "cards: refresh contribution data and SVG cards [skip ci]"
          git push --quiet
